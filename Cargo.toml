[workspace]
members = [
  "crates/mirrarium",
  "crates/mirrarium-cache",
  "crates/mirrarium-corpus",
  "crates/mirrarium-protocol",
  "crates/mirrarium-store",
  "crates/mirrariumd",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.13"
url = "2.5"
